<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f8f3f8">

  <title>MBS Podcasturi</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root{
      --bg:#f8f3f8;
      --surface:#ffffff;
      --card:#f1e7ef;
      --player:#fffafd;

      --text:#211d21;
      --muted:#8b8188;

      --accent:#ad87a5;
      --accent-dark:#8f6a87;
      --accent-soft:#ddcad9;

      --border:#decfda;

      --shadow:
        0 5px 22px rgba(80,50,75,.045);
    }


    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }


    html{
      scroll-behavior:smooth;
      background:var(--bg);
    }


    body{
      margin:0;
      min-height:100vh;

      background:var(--bg);
      color:var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      padding-bottom:
        calc(
          110px +
          env(safe-area-inset-bottom)
        );
    }


    button,
    input{
      font:inherit;
    }


    button{
      cursor:pointer;
    }


    /* =========================
       APP
    ========================= */

    .app{
      width:100%;
      max-width:900px;

      margin:0 auto;

      padding:
        max(24px, env(safe-area-inset-top))
        20px
        50px;
    }


    .page{
      display:none;
    }


    .page.active{
      display:block;

      animation:
        fade .18s ease;
    }


    @keyframes fade{

      from{
        opacity:.5;
        transform:translateY(3px);
      }

      to{
        opacity:1;
        transform:none;
      }

    }


    /* =========================
       TYPOGRAPHY
    ========================= */

    h1{
      margin:0;

      font-size:36px;
      line-height:1.05;

      letter-spacing:-1px;
    }


    h2{
      margin:0;

      font-size:34px;
      line-height:1.1;

      letter-spacing:-.8px;
    }


    .subtitle{
      margin:
        7px
        0
        0;

      color:var(--muted);

      font-size:16px;
    }


    /* =========================
       HEADER
    ========================= */

    .header{
      margin-bottom:22px;
    }


    .eyebrow{
      color:var(--muted);

      font-size:14px;

      margin-bottom:6px;
    }


    /* =========================
       SEARCH
    ========================= */

    .search{
      width:100%;

      min-height:58px;

      margin:
        22px
        0
        14px;

      background:var(--surface);

      border-radius:23px;

      display:flex;

      align-items:center;

      gap:8px;

      padding:
        0
        17px;

      box-shadow:var(--shadow);
    }


    .search-icon{
      color:var(--accent-dark);

      font-size:22px;
    }


    .search input{
      width:100%;

      border:0;
      outline:none;

      background:transparent;

      color:var(--text);

      padding:
        16px
        5px;

      font-size:16px;
    }


    .search input::placeholder{
      color:#aaa0a7;
    }


    /* =========================
       FILTER BUTTON
    ========================= */

    .filter-button{
      width:100%;

      min-height:60px;

      border:0;

      border-radius:23px;

      background:var(--surface);

      color:var(--text);

      padding:
        0
        18px;

      display:flex;

      justify-content:
        space-between;

      align-items:center;

      box-shadow:var(--shadow);

      font-weight:650;

      font-size:16px;
    }


    .filter-left{
      display:flex;

      align-items:center;

      gap:11px;
    }


    .filter-symbol{
      color:var(--accent-dark);

      font-size:19px;
    }


    .filter-arrow{
      font-size:24px;

      font-weight:300;
    }


    /* =========================
       ACTIVE FILTER
    ========================= */

    .active-filter{
      display:none;

      margin-top:13px;

      align-items:center;

      gap:8px;

      flex-wrap:wrap;
    }


    .active-filter.visible{
      display:flex;
    }


    .active-filter-label{
      color:var(--muted);

      font-size:13px;
    }


    .active-filter-pill{
      border:0;

      background:var(--accent);

      color:white;

      padding:
        8px
        13px;

      border-radius:999px;

      font-weight:600;

      font-size:13px;
    }


    /* =========================
       STATUS
    ========================= */

    .status{
      margin:
        17px
        2px;

      color:var(--muted);

      font-size:13px;
    }


    .status.error{
      color:#9b5e72;
    }


    /* =========================
       PODCAST LIST
    ========================= */

    .podcast-list{
      margin-top:22px;

      display:grid;

      grid-template-columns:1fr;

      gap:17px;
    }


    /* =========================
       PODCAST CARD
    ========================= */

    .podcast-card{
      background:var(--card);

      border-radius:28px;

      padding:20px;

      box-shadow:var(--shadow);
    }


    .podcast-tags{
      display:flex;

      flex-wrap:wrap;

      gap:7px;

      margin-bottom:14px;
    }


    .podcast-tag{
      border:
        1px solid
        var(--border);

      background:
        rgba(255,255,255,.62);

      border-radius:999px;

      padding:
        6px
        10px;

      color:var(--accent-dark);

      font-size:12px;

      font-weight:650;
    }


    .podcast-title{
      font-size:21px;

      line-height:1.25;

      font-weight:750;

      margin-bottom:16px;
    }


    /* =========================
       AUDIO PLAYER
    ========================= */

    .audio-player{
      background:var(--player);

      border-radius:23px;

      padding:14px;

      display:grid;

      grid-template-columns:
        58px
        minmax(0,1fr)
        55px;

      gap:13px;

      align-items:center;
    }


    .play-button{
      width:56px;
      height:56px;

      border:0;

      border-radius:50%;

      background:var(--accent);

      color:white;

      display:flex;

      align-items:center;
      justify-content:center;

      font-size:19px;

      padding-left:3px;

      transition:
        transform .12s ease,
        opacity .12s ease;
    }


    .play-button:active{
      transform:scale(.94);
    }


    .play-button.loading{
      opacity:.65;
    }


    .player-main{
      min-width:0;
    }


    .waveform{
      height:38px;

      display:flex;

      align-items:center;

      gap:3px;

      overflow:hidden;

      cursor:pointer;
    }


    .wave-bar{
      width:3px;
      min-width:3px;

      border-radius:999px;

      background:var(--accent-soft);

      transition:
        background .12s ease;
    }


    .wave-bar.active{
      background:var(--accent);
    }


    .player-time{
      margin-top:5px;

      color:var(--muted);

      font-size:13px;
    }


    .speed-button{
      min-width:52px;

      border:
        1px solid
        var(--accent-dark);

      background:transparent;

      color:var(--accent-dark);

      border-radius:999px;

      padding:
        8px
        9px;
    }


    .player-error{
      display:none;

      margin-top:7px;

      color:#9a5c70;

      font-size:12px;
    }


    /* =========================
       CARD FOOTER
    ========================= */

    .podcast-footer{
      margin-top:15px;

      display:flex;

      justify-content:
        space-between;

      align-items:center;

      gap:12px;
    }


    .podcast-date{
      color:var(--muted);

      font-size:13px;
    }


    .save-button{
      border:0;

      min-height:45px;

      padding:
        0
        15px;

      border-radius:16px;

      background:
        rgba(255,255,255,.68);

      color:var(--text);

      display:flex;

      align-items:center;

      gap:7px;

      font-size:14px;

      font-weight:650;
    }


    .save-heart{
      font-size:20px;

      line-height:1;
    }


    .save-button.saved{
      color:var(--accent-dark);
    }


    /* =========================
       FILTER PAGE
    ========================= */

    .back{
      border:0;

      background:
        rgba(255,255,255,.58);

      color:var(--text);

      border-radius:999px;

      padding:
        10px
        15px;

      margin-bottom:24px;
    }


    .filter-list{
      display:flex;

      flex-direction:column;

      gap:10px;

      margin-top:25px;
    }


    .filter-item{
      width:100%;

      border:0;

      background:var(--surface);

      color:var(--text);

      border-radius:20px;

      min-height:60px;

      padding:
        0
        17px;

      display:flex;

      align-items:center;

      justify-content:
        space-between;

      text-align:left;

      box-shadow:var(--shadow);
    }


    .filter-item-left{
      display:flex;

      align-items:center;

      gap:12px;
    }


    .filter-item-name{
      font-weight:650;
    }


    .filter-count{
      min-width:30px;

      padding:
        5px
        9px;

      text-align:center;

      border-radius:999px;

      background:var(--card);

      color:var(--accent-dark);

      font-size:12px;

      font-weight:650;
    }


    .filter-item.selected{
      background:var(--accent);

      color:white;
    }


    .filter-item.selected .filter-count{
      background:
        rgba(255,255,255,.22);

      color:white;
    }


    .all-filter{
      margin-top:18px;

      width:100%;

      border:0;

      min-height:56px;

      border-radius:20px;

      background:var(--accent);

      color:white;

      font-weight:650;
    }


    /* =========================
       EMPTY
    ========================= */

    .empty{
      padding:
        65px
        20px;

      text-align:center;

      color:var(--muted);
    }


    .empty-heart{
      font-size:42px;

      color:var(--accent);

      margin-bottom:14px;
    }


    .empty-title{
      color:var(--text);

      font-size:19px;

      font-weight:700;

      margin-bottom:7px;
    }


    .empty-text{
      font-size:14px;

      line-height:1.5;
    }


    /* =========================
       NAVIGATION
    ========================= */

    .nav{
      position:fixed;

      left:16px;
      right:16px;

      bottom:
        calc(
          13px +
          env(safe-area-inset-bottom)
        );

      max-width:700px;

      margin:auto;

      z-index:100;

      background:#080808;

      border-radius:31px;

      padding:
        8px;

      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:5px;

      box-shadow:
        0 12px 35px
        rgba(0,0,0,.2);
    }


    .nav button{
      border:0;

      background:transparent;

      color:#c8c8c8;

      border-radius:24px;

      min-height:60px;

      display:flex;

      flex-direction:column;

      align-items:center;

      justify-content:center;

      gap:3px;
    }


    .nav button.active{
      background:#292929;

      color:var(--accent);
    }


    .nav-icon{
      font-size:23px;
    }


    .nav-text{
      font-size:11px;
    }


    /* =========================
       TABLET
    ========================= */

    @media(min-width:760px){

      .app{
        padding-left:40px;
        padding-right:40px;
      }


      .podcast-list{
        grid-template-columns:
          1fr
          1fr;
      }


      .podcast-card{
        min-width:0;
      }

    }


    @media(max-width:420px){

      .app{
        padding-left:16px;
        padding-right:16px;
      }


      h1,
      h2{
        font-size:31px;
      }


      .audio-player{
        grid-template-columns:
          52px
          minmax(0,1fr)
          48px;

        gap:9px;
      }


      .play-button{
        width:50px;
        height:50px;
      }


      .speed-button{
        min-width:46px;

        padding:
          7px
          6px;
      }

    }

  </style>
</head>


<body>


<main class="app">


  <!-- =====================================
       PODCASTS
  ====================================== -->

  <section
    id="podcasts"
    class="page active"
  >

    <div class="header">

      <div class="eyebrow">
        MBS
      </div>

      <h1>
        Podcasturi
      </h1>

      <p class="subtitle">
        Biblioteca audio MBS
      </p>

    </div>


    <div class="search">

      <span class="search-icon">
        ⌕
      </span>

      <input
        id="podcastSearch"
        type="text"
        placeholder="Caută..."
      >

    </div>


    <button
      id="openFilters"
      class="filter-button"
      type="button"
    >

      <span class="filter-left">

        <span class="filter-symbol">
          ◇
        </span>

        <span>
          Filtru după teme
        </span>

      </span>

      <span class="filter-arrow">
        ›
      </span>

    </button>


    <div
      id="activeFilterBox"
      class="active-filter"
    >

      <span class="active-filter-label">
        Filtru:
      </span>

      <button
        id="activeFilterPill"
        class="active-filter-pill"
      ></button>

    </div>


    <div
      id="telegramStatus"
      class="status"
    >
      Se încarcă...
    </div>


    <div
      id="podcastList"
      class="podcast-list"
    ></div>

  </section>



  <!-- =====================================
       FILTERS
  ====================================== -->

  <section
    id="filters"
    class="page"
  >

    <button
      id="filterBack"
      class="back"
    >
      ‹ Înapoi
    </button>


    <div class="header">

      <div class="eyebrow">
        Podcasturi
      </div>

      <h2>
        Filtre
      </h2>

      <p class="subtitle">
        Alege tema pe care vrei să o explorezi.
      </p>

    </div>


    <button
      id="showAll"
      class="all-filter"
    >
      Toate podcasturile
    </button>


    <div
      id="filterList"
      class="filter-list"
    ></div>

  </section>



  <!-- =====================================
       SAVED
  ====================================== -->

  <section
    id="saved"
    class="page"
  >

    <div class="header">

      <div class="eyebrow">
        Biblioteca ta
      </div>

      <h2>
        Salvate
      </h2>

      <p class="subtitle">
        Podcasturile pe care vrei să le păstrezi.
      </p>

    </div>


    <div class="search">

      <span class="search-icon">
        ⌕
      </span>

      <input
        id="savedSearch"
        type="text"
        placeholder="Caută în salvate..."
      >

    </div>


    <div
      id="savedList"
      class="podcast-list"
    ></div>

  </section>


</main>



<!-- =====================================
     NAVIGATION
====================================== -->

<nav class="nav">

  <button
    class="active"
    data-page="podcasts"
  >

    <span class="nav-icon">
      ◉
    </span>

    <span class="nav-text">
      Podcasturi
    </span>

  </button>


  <button
    data-page="saved"
  >

    <span class="nav-icon">
      ♡
    </span>

    <span class="nav-text">
      Salvate
    </span>

  </button>

</nav>



<script>

  /* =========================================================
     CONFIG
  ========================================================= */

  const SUPABASE_URL =
    "https://njthqqnebvmcubvwfrzz.supabase.co";


  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_AKBoN-KjVCj9lNABwwy4tQ_a7BeddTH";


  const SWIFT_API_URL =
    "https://njthqqnebvmcubvwfrzz.supabase.co/functions/v1/swift-api";


  /* =========================================================
     SUPABASE
  ========================================================= */

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  /* =========================================================
     TELEGRAM
  ========================================================= */

  const tg =
    window.Telegram?.WebApp;


  if(tg){

    tg.ready();

    tg.expand();


    try{

      tg.setHeaderColor(
        "#f8f3f8"
      );

      tg.setBackgroundColor(
        "#f8f3f8"
      );

    }catch(error){

      console.log(
        "Telegram colors:",
        error
      );

    }

  }


  /* =========================================================
     DATA
  ========================================================= */

  let telegramItems = [];

  let selectedFilter =
    "all";


  let favorites =
    JSON.parse(
      localStorage.getItem(
        "mbsPodcastFavorites"
      )
      ||
      "[]"
    );


  let activeAudio =
    null;


  let activePlayer =
    null;


  const playbackSpeeds =
    [
      1,
      1.25,
      1.5,
      2
    ];


  /* =========================================================
     NAVIGATION
  ========================================================= */

  const pages =
    document.querySelectorAll(
      ".page"
    );


  const navButtons =
    document.querySelectorAll(
      ".nav button"
    );


  function openPage(id){

    stopActiveAudio();


    pages.forEach(
      page =>
        page.classList.remove(
          "active"
        )
    );


    const target =
      document.getElementById(
        id
      );


    if(target){

      target.classList.add(
        "active"
      );

    }


    navButtons.forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.page === id
        );

      }
    );


    window.scrollTo(
      0,
      0
    );


    if(
      id === "podcasts"
    ){

      renderPodcasts();

    }


    if(
      id === "saved"
    ){

      renderSaved();

    }


    if(
      id === "filters"
    ){

      renderFilters();

    }

  }


  navButtons.forEach(
    button => {

      button.onclick =
        () => {

          openPage(
            button.dataset.page
          );

        };

    }
  );


  document
    .getElementById(
      "openFilters"
    )
    .onclick =
      () =>
        openPage(
          "filters"
        );


  document
    .getElementById(
      "filterBack"
    )
    .onclick =
      () =>
        openPage(
          "podcasts"
        );


  /* =========================================================
     HELPERS
  ========================================================= */

  function escapeHTML(
    value = ""
  ){

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  function normalizeTag(
    value = ""
  ){

    return String(value)

      .replace(
        /^#/,
        ""
      )

      .toLowerCase()

      .normalize(
        "NFD"
      )

      .replace(
        /[\u0300-\u036f]/g,
        ""
      );

  }


  function formatDate(
    value
  ){

    if(!value){

      return "";

    }


    try{

      return new Date(value)
        .toLocaleDateString(
          "ro-RO",
          {
            day:"2-digit",
            month:"short",
            year:"numeric"
          }
        );

    }catch{

      return "";

    }

  }


  function formatTime(
    seconds
  ){

    if(
      !Number.isFinite(
        seconds
      )
    ){

      return "0:00";

    }


    seconds =
      Math.max(
        0,
        Math.floor(
          seconds
        )
      );


    const minutes =
      Math.floor(
        seconds / 60
      );


    const secs =
      seconds % 60;


    return (
      minutes
      +
      ":"
      +
      String(
        secs
      )
      .padStart(
        2,
        "0"
      )
    );

  }


  /* =========================================================
     LOAD TELEGRAM CONTENT
  ========================================================= */

  async function loadTelegramContent(){

    const status =
      document.getElementById(
        "telegramStatus"
      );


    status.className =
      "status";


    status.textContent =
      "Se încarcă...";


    try{

      const {
        data,
        error
      } =
        await supabaseClient

          .from(
            "telegram_content"
          )

          .select(
            `
              id,
              title,
              text,
              content_type,
              hashtags,
              telegram_file_id,
              telegram_date,
              is_published
            `
          )

          .eq(
            "is_published",
            true
          )

          .order(
            "telegram_date",
            {
              ascending:false
            }
          );


      if(error){

        throw error;

      }


      /*
        Pentru moment păstrăm în bibliotecă
        doar materialele audio.
      */

      telegramItems =
        (data || [])
        .filter(
          item =>
            (
              item.content_type ===
              "audio"
              ||
              item.content_type ===
              "voice"
            )
            &&
            item.telegram_file_id
        );


      status.textContent =
        "";


      renderPodcasts();

      renderFilters();

      renderSaved();


    }catch(error){

      console.error(
        "Load error:",
        error
      );


      status.className =
        "status error";


      status.textContent =
        "Nu am putut încărca podcasturile.";

    }

  }


  /* =========================================================
     FAVORITES
  ========================================================= */

  function favoriteKey(
    id
  ){

    return (
      "telegram:" +
      id
    );

  }


  function isFavorite(
    id
  ){

    return favorites.includes(
      favoriteKey(
        id
      )
    );

  }


  function toggleFavorite(
    id
  ){

    const key =
      favoriteKey(
        id
      );


    if(
      favorites.includes(
        key
      )
    ){

      favorites =
        favorites.filter(
          item =>
            item !== key
        );

    }else{

      favorites.push(
        key
      );

    }


    localStorage.setItem(
      "mbsPodcastFavorites",
      JSON.stringify(
        favorites
      )
    );


    renderPodcasts();

    renderSaved();

  }


  /* =========================================================
     STREAM URL
  ========================================================= */

  function getStreamUrl(
    fileId
  ){

    return (
      SWIFT_API_URL
      +
      "?stream=1&file_id="
      +
      encodeURIComponent(
        fileId
      )
    );

  }


  /* =========================================================
     WAVEFORM
  ========================================================= */

  function createWaveform(
    itemId
  ){

    let html = "";


    const numericSeed =
      String(
        itemId || "1"
      )
      .split("")
      .reduce(
        (
          total,
          char
        ) =>
          total +
          char.charCodeAt(0),
        0
      );


    for(
      let i = 0;
      i < 60;
      i++
    ){

      const height =
        8
        +
        (
          (
            i * 17
            +
            numericSeed * 11
          )
          %
          27
        );


      html += `
        <span
          class="wave-bar"
          style="height:${height}px"
        ></span>
      `;

    }


    return html;

  }


  function updateWaveform(
    player,
    percent
  ){

    const bars =
      player.querySelectorAll(
        ".wave-bar"
      );


    const activeCount =
      Math.round(
        bars.length *
        percent
      );


    bars.forEach(
      (
        bar,
        index
      ) => {

        bar.classList.toggle(
          "active",
          index < activeCount
        );

      }
    );

  }


  /* =========================================================
     AUDIO ENGINE
  ========================================================= */

  function resetPlayerUI(
    player
  ){

    if(!player){

      return;

    }


    const play =
      player.querySelector(
        ".play-button"
      );


    if(play){

      play.textContent =
        "▶";


      play.classList.remove(
        "loading"
      );

    }

  }


  function stopActiveAudio(){

    if(activeAudio){

      activeAudio.pause();

    }


    resetPlayerUI(
      activePlayer
    );


    activeAudio =
      null;


    activePlayer =
      null;

  }


  function updateTime(
    player,
    audio
  ){

    const time =
      player.querySelector(
        ".player-time"
      );


    if(!time){

      return;

    }


    const duration =
      Number.isFinite(
        audio.duration
      )
        ? formatTime(
            audio.duration
          )
        : "--:--";


    time.textContent =
      formatTime(
        audio.currentTime
      )
      +
      " / "
      +
      duration;

  }


  async function toggleAudio(
    button
  ){

    const player =
      button.closest(
        ".audio-player"
      );


    const fileId =
      button.dataset.fileId;


    if(!fileId){

      return;

    }


    /*
      SAME PLAYER
    */

    if(
      activePlayer === player
      &&
      activeAudio
    ){

      if(
        activeAudio.paused
      ){

        try{

          await activeAudio.play();

          button.textContent =
            "❚❚";

        }catch(error){

          console.error(
            error
          );

        }

      }else{

        activeAudio.pause();

        button.textContent =
          "▶";

      }


      return;

    }


    /*
      NEW PLAYER
    */

    stopActiveAudio();


    button.textContent =
      "…";


    button.classList.add(
      "loading"
    );


    const errorBox =
      player.querySelector(
        ".player-error"
      );


    errorBox.style.display =
      "none";


    const audio =
      new Audio();


    audio.preload =
      "metadata";


    audio.src =
      getStreamUrl(
        fileId
      );


    audio.playsInline =
      true;


    activeAudio =
      audio;


    activePlayer =
      player;


    audio.addEventListener(
      "loadedmetadata",
      () => {

        updateTime(
          player,
          audio
        );

      }
    );


    audio.addEventListener(
      "durationchange",
      () => {

        updateTime(
          player,
          audio
        );

      }
    );


    audio.addEventListener(
      "timeupdate",
      () => {

        updateTime(
          player,
          audio
        );


        const percent =
          audio.duration
            ? audio.currentTime /
              audio.duration
            : 0;


        updateWaveform(
          player,
          percent
        );

      }
    );


    audio.addEventListener(
      "play",
      () => {

        button.classList.remove(
          "loading"
        );


        button.textContent =
          "❚❚";

      }
    );


    audio.addEventListener(
      "pause",
      () => {

        if(
          !audio.ended
        ){

          button.textContent =
            "▶";

        }

      }
    );


    audio.addEventListener(
      "ended",
      () => {

        button.textContent =
          "▶";


        audio.currentTime =
          0;


        updateWaveform(
          player,
          0
        );


        updateTime(
          player,
          audio
        );

      }
    );


    audio.addEventListener(
      "error",
      () => {

        button.classList.remove(
          "loading"
        );


        button.textContent =
          "▶";


        errorBox.style.display =
          "block";


        errorBox.textContent =
          "Audio indisponibil";


        console.error(
          "Audio error:",
          audio.error
        );

      }
    );


    try{

      await audio.play();

    }catch(error){

      console.error(
        "Play error:",
        error
      );


      button.classList.remove(
        "loading"
      );


      button.textContent =
        "▶";


      errorBox.style.display =
        "block";


      errorBox.textContent =
        "Nu am putut porni audio-ul.";

    }

  }


  /* =========================================================
     SPEED
  ========================================================= */

  function cycleSpeed(
    button
  ){

    const player =
      button.closest(
        ".audio-player"
      );


    if(
      player !== activePlayer
      ||
      !activeAudio
    ){

      return;

    }


    const current =
      activeAudio.playbackRate;


    let index =
      playbackSpeeds.indexOf(
        current
      );


    index =
      (
        index + 1
      )
      %
      playbackSpeeds.length;


    const next =
      playbackSpeeds[
        index
      ];


    activeAudio.playbackRate =
      next;


    button.textContent =
      next + "x";

  }


  /* =========================================================
     SEEK
  ========================================================= */

  function seekWaveform(
    waveform,
    event
  ){

    const player =
      waveform.closest(
        ".audio-player"
      );


    if(
      player !== activePlayer
      ||
      !activeAudio
      ||
      !activeAudio.duration
    ){

      return;

    }


    const rect =
      waveform
        .getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const ratio =
      Math.min(
        1,
        Math.max(
          0,
          x /
          rect.width
        )
      );


    activeAudio.currentTime =
      activeAudio.duration *
      ratio;

  }


  /* =========================================================
     CARD
  ========================================================= */

  function cardHTML(
    item
  ){

    const tags =
      Array.isArray(
        item.hashtags
      )
        ? item.hashtags
        : [];


    const title =
      item.title ||
      "Podcast MBS";


    const saved =
      isFavorite(
        item.id
      );


    const date =
      formatDate(
        item.telegram_date
      );


    return `

      <article
        class="podcast-card"
      >


        ${
          tags.length
            ? `

              <div
                class="podcast-tags"
              >

                ${

                  tags
                    .map(
                      tag => {

                        const label =
                          String(tag)
                            .startsWith("#")
                            ? tag
                            : "#" + tag;


                        return `

                          <span
                            class="podcast-tag"
                          >
                            ${escapeHTML(label)}
                          </span>

                        `;

                      }
                    )
                    .join("")

                }

              </div>

            `
            : ""
        }


        <div
          class="podcast-title"
        >
          ${escapeHTML(title)}
        </div>


        <div
          class="audio-player"
          data-player-id="${escapeHTML(item.id)}"
        >


          <button
            class="play-button"
            data-file-id="${escapeHTML(item.telegram_file_id)}"
            type="button"
          >
            ▶
          </button>


          <div
            class="player-main"
          >

            <div
              class="waveform"
            >

              ${createWaveform(
                item.id
              )}

            </div>


            <div
              class="player-time"
            >
              0:00 / --:--
            </div>


            <div
              class="player-error"
            ></div>

          </div>


          <button
            class="speed-button"
            type="button"
          >
            1x
          </button>


        </div>


        <div
          class="podcast-footer"
        >


          <div
            class="podcast-date"
          >
            ${escapeHTML(date)}
          </div>


          <button
            class="save-button ${
              saved
                ? "saved"
                : ""
            }"
            data-save-id="${escapeHTML(item.id)}"
            type="button"
          >

            <span
              class="save-heart"
            >
              ${
                saved
                  ? "♥"
                  : "♡"
              }
            </span>

            <span>
              ${
                saved
                  ? "Salvat"
                  : "Salvează"
              }
            </span>

          </button>


        </div>


      </article>

    `;

  }


  /* =========================================================
     BIND CARDS
  ========================================================= */

  function bindCards(
    container
  ){

    container
      .querySelectorAll(
        ".play-button"
      )
      .forEach(
        button => {

          button.onclick =
            () =>
              toggleAudio(
                button
              );

        }
      );


    container
      .querySelectorAll(
        ".speed-button"
      )
      .forEach(
        button => {

          button.onclick =
            () =>
              cycleSpeed(
                button
              );

        }
      );


    container
      .querySelectorAll(
        ".waveform"
      )
      .forEach(
        waveform => {

          waveform.onclick =
            event =>
              seekWaveform(
                waveform,
                event
              );

        }
      );


    container
      .querySelectorAll(
        "[data-save-id]"
      )
      .forEach(
        button => {

          button.onclick =
            () => {

              toggleFavorite(
                button.dataset.saveId
              );

            };

        }
      );

  }


  /* =========================================================
     FILTER STATE
  ========================================================= */

  function updateActiveFilterUI(){

    const box =
      document.getElementById(
        "activeFilterBox"
      );


    const pill =
      document.getElementById(
        "activeFilterPill"
      );


    if(
      selectedFilter === "all"
    ){

      box.classList.remove(
        "visible"
      );


      return;

    }


    box.classList.add(
      "visible"
    );


    pill.textContent =
      "#" + selectedFilter +
      " ×";

  }


  document
    .getElementById(
      "activeFilterPill"
    )
    .onclick =
      () => {

        selectedFilter =
          "all";


        updateActiveFilterUI();

        renderPodcasts();

      };


  /* =========================================================
     RENDER PODCASTS
  ========================================================= */

  function renderPodcasts(){

    const container =
      document.getElementById(
        "podcastList"
      );


    const search =
      (
        document
          .getElementById(
            "podcastSearch"
          )
          ?.value
        ||
        ""
      )
      .trim()
      .toLowerCase();


    const filtered =
      telegramItems.filter(
        item => {

          const tags =
            Array.isArray(
              item.hashtags
            )
              ? item.hashtags
              : [];


          const normalizedTags =
            tags.map(
              normalizeTag
            );


          const filterOK =
            selectedFilter === "all"
            ||
            normalizedTags.includes(
              selectedFilter
            );


          const haystack =
            [
              item.title || "",
              item.text || "",
              tags.join(" ")
            ]
            .join(" ")
            .toLowerCase();


          const searchOK =
            !search
            ||
            haystack.includes(
              search
            );


          return (
            filterOK
            &&
            searchOK
          );

        }
      );


    updateActiveFilterUI();


    if(
      !filtered.length
    ){

      container.innerHTML =
        `

          <div
            class="empty"
            style="grid-column:1/-1;"
          >

            <div
              class="empty-title"
            >
              Nu am găsit podcasturi
            </div>

            <div
              class="empty-text"
            >
              Încearcă o altă căutare sau elimină filtrul.
            </div>

          </div>

        `;


      return;

    }


    container.innerHTML =
      filtered
        .map(
          cardHTML
        )
        .join("");


    bindCards(
      container
    );

  }


  document
    .getElementById(
      "podcastSearch"
    )
    .addEventListener(
      "input",
      renderPodcasts
    );


  /* =========================================================
     FILTER PAGE
  ========================================================= */

  function getAvailableFilters(){

    const map =
      new Map();


    telegramItems.forEach(
      item => {

        const tags =
          Array.isArray(
            item.hashtags
          )
            ? item.hashtags
            : [];


        tags.forEach(
          rawTag => {

            const normalized =
              normalizeTag(
                rawTag
              );


            if(!normalized){

              return;

            }


            if(
              !map.has(
                normalized
              )
            ){

              map.set(
                normalized,
                {
                  key:normalized,
                  label:
                    String(rawTag)
                      .startsWith("#")
                      ? String(rawTag)
                      : "#" + rawTag,

                  count:0
                }
              );

            }


            map.get(
              normalized
            ).count++;

          }
        );

      }
    );


    return [...map.values()]
      .sort(
        (
          a,
          b
        ) => {

          if(
            b.count !== a.count
          ){

            return (
              b.count -
              a.count
            );

          }


          return a.label.localeCompare(
            b.label,
            "ro"
          );

        }
      );

  }


  function renderFilters(){

    const container =
      document.getElementById(
        "filterList"
      );


    const filters =
      getAvailableFilters();


    if(
      !filters.length
    ){

      container.innerHTML =
        `

          <div class="empty">

            Nu există încă hashtaguri.

          </div>

        `;


      return;

    }


    container.innerHTML =
      filters
        .map(
          filter => `

            <button
              class="filter-item ${
                selectedFilter ===
                filter.key
                  ? "selected"
                  : ""
              }"
              data-filter="${escapeHTML(filter.key)}"
            >

              <span
                class="filter-item-left"
              >

                <span>
                  #
                </span>

                <span
                  class="filter-item-name"
                >
                  ${escapeHTML(
                    filter.label.replace(
                      /^#/,
                      ""
                    )
                  )}
                </span>

              </span>


              <span
                class="filter-count"
              >
                ${filter.count}
              </span>

            </button>

          `
        )
        .join("");


    container
      .querySelectorAll(
        "[data-filter]"
      )
      .forEach(
        button => {

          button.onclick =
            () => {

              selectedFilter =
                button.dataset.filter;


              openPage(
                "podcasts"
              );

            };

        }
      );

  }


  document
    .getElementById(
      "showAll"
    )
    .onclick =
      () => {

        selectedFilter =
          "all";


        openPage(
          "podcasts"
        );

      };


  /* =========================================================
     SAVED
  ========================================================= */

  function renderSaved(){

    const container =
      document.getElementById(
        "savedList"
      );


    const query =
      (
        document
          .getElementById(
            "savedSearch"
          )
          ?.value
        ||
        ""
      )
      .trim()
      .toLowerCase();


    const selected =
      telegramItems.filter(
        item => {

          if(
            !isFavorite(
              item.id
            )
          ){

            return false;

          }


          if(!query){

            return true;

          }


          const tags =
            Array.isArray(
              item.hashtags
            )
              ? item.hashtags
              : [];


          const haystack =
            [
              item.title || "",
              item.text || "",
              tags.join(" ")
            ]
            .join(" ")
            .toLowerCase();


          return haystack.includes(
            query
          );

        }
      );


    if(
      !selected.length
    ){

      container.innerHTML =
        `

          <div
            class="empty"
            style="grid-column:1/-1;"
          >

            <div
              class="empty-heart"
            >
              ♡
            </div>

            <div
              class="empty-title"
            >
              Încă nu ai podcasturi salvate
            </div>

            <div
              class="empty-text"
            >
              Apasă „Salvează” la un podcast și îl vei găsi aici.
            </div>

          </div>

        `;


      return;

    }


    container.innerHTML =
      selected
        .map(
          cardHTML
        )
        .join("");


    bindCards(
      container
    );

  }


  document
    .getElementById(
      "savedSearch"
    )
    .addEventListener(
      "input",
      renderSaved
    );


  /* =========================================================
     START
  ========================================================= */

  async function startApp(){

    await loadTelegramContent();

  }


  startApp();

</script>
