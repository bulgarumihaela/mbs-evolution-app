<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MBS Evolution</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f5f2;
      color: #222;
      padding-bottom: 100px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 24px 18px;
    }

    h1 {
      margin-bottom: 5px;
    }

    .subtitle {
      color: #777;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .welcome {
      background: white;
      border-radius: 24px;
      padding: 25px;
      margin-bottom: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .card {
      background: white;
      border-radius: 24px;
      min-height: 150px;
      padding: 20px;
      display: flex;
      align-items: flex-end;
      font-size: 18px;
      font-weight: 600;
    }

    .menu {
      position: fixed;
      bottom: 15px;
      left: 15px;
      right: 15px;
      max-width: 570px;
      margin: auto;
      background: #181818;
      color: white;
      border-radius: 28px;
      padding: 16px 10px;
      display: flex;
      justify-content: space-around;
    }

    .menu-item {
      text-align: center;
      font-size: 13px;
    }

    .icon {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>MBS Evolution</h1>
    <p class="subtitle">Mind • Body • Soul</p>

    <div class="welcome">
      <h2>Bine ai venit ♡</h2>
      <p>Un spațiu pentru evoluție, practici și resurse pentru tine.</p>
    </div>

    <div class="grid">

      <div class="card">
        Practici
      </div>

      <div class="card">
        Audio
      </div>

      <div class="card">
        Sesiuni 1:1
      </div>

      <div class="card">
        Programele mele
      </div>

      <div class="card">
        Despre mine
      </div>

      <div class="card">
        Întrebări
      </div>

    </div>

  </div>

  <div class="menu">

    <div class="menu-item">
      <span class="icon">⌂</span>
      Acasă
    </div>

    <div class="menu-item">
      <span class="icon">◉</span>
      Practici
    </div>

    <div class="menu-item">
      <span class="icon">♡</span>
      Favorite
    </div>

    <div class="menu-item">
      <span class="icon">○</span>
      Profil
    </div>

  </div>

</body>
</html>
